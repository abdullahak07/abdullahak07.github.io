<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Perth Tradie Quote AI</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#eef2ff;background:#0f172a}body{margin:0;background:linear-gradient(160deg,#0f172a,#111827 55%,#1e293b);min-height:100vh}.app{max-width:760px;margin:auto;padding:18px}.card{background:#111827ee;border:1px solid #334155;border-radius:22px;padding:18px;margin:14px 0;box-shadow:0 14px 35px #0005}h1{font-size:28px;margin:8px 0}button,input,select,textarea{font:inherit;border-radius:14px;border:1px solid #475569;padding:14px;background:#0b1220;color:#fff}button{background:#22c55e;color:#052e16;font-weight:800;min-height:52px;border:0;width:100%;margin:6px 0}.secondary{background:#334155;color:#e2e8f0}.danger{background:#ef4444;color:white}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hidden{display:none}.badge{display:inline-block;background:#f59e0b;color:#111827;font-weight:900;padding:6px 10px;border-radius:99px}.online{float:right;color:#86efac}.offline{float:right;color:#fca5a5}.rec{display:flex;align-items:center;gap:10px}.dot{width:16px;height:16px;border-radius:50%;background:#ef4444;animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.3}}.item{border:1px solid #334155;padding:12px;border-radius:16px;margin:10px 0}.totals{font-size:20px;font-weight:900;text-align:right}.progress{height:10px;background:#334155;border-radius:99px;overflow:hidden}.bar{height:100%;width:0;background:#22c55e;transition:.4s}label{display:block;font-size:13px;color:#cbd5e1;margin-top:8px}textarea{width:100%;box-sizing:border-box;min-height:90px}.live{background:#dc2626;color:#fff;text-align:center;padding:10px;font-weight:900;letter-spacing:.08em}</style></head><body><div id="banner" class="live hidden">LIVE DEMO MODE</div><main class="app"><span id="net" class="online">● online</span><h1>Perth Tradie Quote AI</h1><p>Record a job memo, review every dollar, generate a branded PDF.</p>
<section class="card"><div class="row"><button id="recBtn">🎙️ Record Voice Memo</button><button class="secondary" id="demoBtn">⚡ Demo Mode</button></div><div id="recording" class="rec hidden"><span class="dot"></span><b>Recording</b> <span id="timer">0s</span></div><textarea id="text" placeholder="Fallback: type job details here, e.g. 3 downlights in bedroom, 2 power points in garage..."></textarea><label>Customer</label><div class="row"><input id="custName" placeholder="Name"><input id="custPhone" placeholder="Phone"></div><input id="custEmail" placeholder="Email"><input id="custAddress" placeholder="Address"><label>Pricing profile</label><select id="profile"><option>Residential</option><option>Commercial</option><option>FIFO</option><option>Emergency</option></select><button id="buildBtn">Build Quote</button></section>
<section id="demoPanel" class="card hidden"><h2>Demo samples</h2><div id="samples"></div></section><section id="status" class="card hidden"><b id="statusText">Working...</b><div class="progress"><div id="bar" class="bar"></div></div></section>
<section id="quoteCard" class="card hidden"><h2>Draft Quote</h2><div id="items"></div><button class="secondary" id="addItem">+ Add custom line</button><div class="totals" id="totals"></div><button id="pdfBtn">Generate PDF</button><button class="secondary" id="shareBtn">Share / Email</button></section></main><script>
let mediaRecorder,chunks=[],seconds=0,tick,quote=null,settings=null;const $=id=>document.getElementById(id);function status(t,p){$('status').classList.remove('hidden');$('statusText').textContent=t;$('bar').style.width=p+'%'}function hideStatus(){$('status').classList.add('hidden')}function net(){let on=navigator.onLine;$('net').className=on?'online':'offline';$('net').textContent=on?'● online':'● offline'}addEventListener('online',net);addEventListener('offline',net);net();fetch('/pricing-defaults').then(r=>r.json()).then(j=>settings=j);
$('recBtn').onclick=async()=>{if(mediaRecorder&&mediaRecorder.state==='recording'){mediaRecorder.stop();return}try{let stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];mediaRecorder=new MediaRecorder(stream);mediaRecorder.ondataavailable=e=>chunks.push(e.data);mediaRecorder.onstop=uploadAudio;mediaRecorder.start();seconds=0;$('recording').classList.remove('hidden');$('recBtn').textContent='Done';tick=setInterval(()=>{seconds++;$('timer').textContent=seconds+'s';if(seconds>=60)mediaRecorder.stop()},1000)}catch(e){alert('Microphone blocked — type the job in the text box instead.')}};
async function uploadAudio(){clearInterval(tick);$('recording').classList.add('hidden');$('recBtn').textContent='🎙️ Record Voice Memo';status('Transcribing...',35);let blob=new Blob(chunks,{type:'audio/webm'}),fd=new FormData();fd.append('audio',blob,'memo.webm');try{let r=await fetch('/transcribe',{method:'POST',body:fd});if(!r.ok)throw 0;let j=await r.json();$('text').value=j.text;hideStatus()}catch(e){hideStatus();alert("Couldn't understand that — try speaking slower or type it in")}}
$('demoBtn').onclick=async()=>{$('banner').classList.toggle('hidden');$('demoPanel').classList.toggle('hidden');let s=await (await fetch('/demo-samples')).json();$('samples').innerHTML=s.map(x=>`<button class="secondary" onclick="loadDemo('${x.id}')">${x.title}</button>`).join('');window.demoSamples=s};window.loadDemo=id=>{let x=window.demoSamples.find(s=>s.id===id);$('text').value=x.text;$('custName').value='Demo Customer';buildQuote(true)};
$('buildBtn').onclick=()=>buildQuote(false);async function buildQuote(demo){status('Warming up AI / Building quote...',65);let body={text:$('text').value,profile:$('profile').value,demo,customer:{name:$('custName').value||'Walk-in Customer',phone:$('custPhone').value,email:$('custEmail').value,address:$('custAddress').value}};try{let r=await fetch('/generate-quote',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw 0;quote=await r.json();render();hideStatus()}catch(e){status('Could not generate quote — please try again or enter manually',100)}}
function render(){ $('quoteCard').classList.remove('hidden');$('items').innerHTML=quote.line_items.map((it,i)=>`<div class="item"><input value="${it.description}" onchange="quote.line_items[${i}].description=this.value"><div class="row"><label>Qty<input type="number" step=".1" value="${it.quantity}" onchange="upd(${i},'quantity',this.value)"></label><label>Hours<input type="number" step=".1" value="${it.labor_hours}" onchange="upd(${i},'labor_hours',this.value)"></label><label>Rate<input type="number" value="${it.hourly_rate}" onchange="upd(${i},'hourly_rate',this.value)"></label><label>Material $<input type="number" step=".01" value="${it.material_unit_cost}" onchange="upd(${i},'material_unit_cost',this.value)"></label></div><button class="danger" onclick="quote.line_items.splice(${i},1);recalc()">Remove</button></div>`).join('');$('totals').innerHTML=`Subtotal $${quote.subtotal.toFixed(2)}<br>GST $${quote.gst.toFixed(2)}<br>Total $${quote.total.toFixed(2)}`}
window.upd=(i,k,v)=>{quote.line_items[i][k]=parseFloat(v)||0;recalc()};async function recalc(){let r=await fetch('/update-quote',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(quote)});quote=await r.json();render()}$('addItem').onclick=()=>{quote.line_items.push({description:'Custom item',quantity:1,location:'',material_unit_cost:0,labor_hours:1,hourly_rate:95,material_markup_percent:20});recalc()};
$('pdfBtn').onclick=async()=>{status('Generating PDF...',90);let r=await fetch('/generate-pdf',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(quote)});let b=await r.blob();let url=URL.createObjectURL(b);open(url,'_blank');quote.pdfUrl=url;hideStatus()};$('shareBtn').onclick=async()=>{let msg=`Hi ${$('custName').value||'there'}, please find your quote attached. Valid for 30 days. Let me know if you have questions.`;if(navigator.share)try{await navigator.share({title:'Your quote',text:msg,url:quote?.pdfUrl||location.href});return}catch(e){} location.href=`mailto:${$('custEmail').value}?subject=Your quote&body=${encodeURIComponent(msg)}`}
</script></body></html>
